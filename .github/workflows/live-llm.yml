name: Bounded live resident campaign
on:
  push:
    branches: [campaign/live-resident-once]
permissions:
  contents: read
concurrency:
  group: authorized-live-resident-once
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.7
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync python tools/live_llm_campaign.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_KEY || secrets.OPENAI }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-resident-evidence
          path: evidence/live_llm_campaign.json
