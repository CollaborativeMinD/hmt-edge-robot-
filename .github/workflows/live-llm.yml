name: Resident credential metadata
on:
  push:
    branches: [campaign/provider-metadata]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: python tools/provider_metadata.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_KEY || secrets.OPENAI }}
      - uses: actions/upload-artifact@v4
        with:
          name: provider-metadata
          path: evidence/provider_metadata.json
