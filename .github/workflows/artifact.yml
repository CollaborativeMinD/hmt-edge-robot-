name: ARM64 artifact qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: artifact-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  host_updates:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Admit appliance design and fetch pinned official host updates
        run: |
          python3 tools/appliance_design.py
          python3 tools/appliance_host.py --fetch
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from appliance_fetch import fetch
          fetch(json.loads(Path('deploy/appliance/inputs.json').read_text())['os'], Path('build/inputs/base.img.xz'))
          PY
      - name: Install into a disposable Pi OS image and verify native package state
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xz-utils e2fsprogs
          sudo --preserve-env=GITHUB_SHA bash deploy/appliance/qualify-host.sh "$PWD" 2>&1 | tee build/host-update-install.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: host-updates-${{ github.sha }}
          path: |
            build/host-updates.json
            build/host-hardening.json
            build/host-admission.json
            build/appliance-vulnerabilities.json
            build/host-update-install.log
          retention-days: 30
          if-no-files-found: warn
  qualify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      UV_PYTHON: '3.12'
      UV_NO_PROGRESS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Invalidate stale qualification before any build
        run: |
          mkdir -p evidence/cd/stage4
          echo '{"status":"FAIL","stage":4,"deployment":"HOLD","hardware":"HOLD","alert":true,"reason_codes":["CAMPAIGN_INCOMPLETE"]}' > evidence/cd/stage4/qualification.json
          python3 tools/ci_admission.py
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: 0.9.7
          enable-cache: false
      - name: Locked software gates before artifact construction
        run: |
          uv lock --check
          uv sync --locked --extra dev
          uv run --no-sync python tools/validate.py
      - name: Resolve immutable build inputs once and record tool inventory
        run: |
          test "$(uname -m)" = aarch64
          docker pull --platform linux/arm64 python:3.12-slim-trixie
          docker pull --platform linux/arm64 ghcr.io/astral-sh/uv:0.9.7
          docker pull --platform linux/arm64 aquasec/trivy:0.69.3
          docker pull --platform linux/arm64 moby/buildkit:v0.25.1
          python3 - <<'PY'
          import json, subprocess
          tags = {'python':'python:3.12-slim-trixie','uv':'ghcr.io/astral-sh/uv:0.9.7','trivy':'aquasec/trivy:0.69.3','buildkit':'moby/buildkit:v0.25.1'}
          bases = {key:json.loads(subprocess.check_output(['docker','image','inspect',tag]))[0]['RepoDigests'][0] for key,tag in tags.items()}
          open('evidence/cd/stage4/base-lock.json','w').write(json.dumps(bases,indent=2)+'\n')
          import os
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('BUILDKIT_IMAGE='+bases['buildkit']+'\n')
          with open('evidence/cd/stage4/tool-inventory.txt','w') as output:
              subprocess.run(['docker','version'],stdout=output,check=True)
              subprocess.run(['gh','version'],stdout=output,check=True)
          PY
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Build one locked ARM64 OCI archive
        run: |
          PYTHON_IMAGE=$(python3 -c 'import json; print(json.load(open("evidence/cd/stage4/base-lock.json"))["python"])')
          UV_IMAGE=$(python3 -c 'import json; print(json.load(open("evidence/cd/stage4/base-lock.json"))["uv"])')
          docker buildx build --platform linux/arm64 --file deploy/stage4/Dockerfile --build-arg "PYTHON_IMAGE=$PYTHON_IMAGE" --build-arg "UV_IMAGE=$UV_IMAGE" --build-arg "SOURCE_COMMIT=$GITHUB_SHA" --provenance=mode=max --metadata-file evidence/cd/stage4/build-metadata.json --output type=oci,dest=evidence/cd/stage4/image.oci.tar .
          cat evidence/cd/stage4/build-metadata.json
      - name: Load the exact OCI runtime image and qualify without network or privileges
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo --version >> evidence/cd/stage4/tool-inventory.txt
          skopeo copy --override-arch arm64 --override-os linux oci-archive:evidence/cd/stage4/image.oci.tar docker-daemon:hmt-edge:qualification
          docker image inspect hmt-edge:qualification > evidence/cd/stage4/loaded-image.json
          timeout --signal=TERM --kill-after=10s 120s docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 2g --cpus 2 --user 10001:10001 --tmpfs /data:rw,uid=10001,gid=10001,size=67108864 --tmpfs /run/hmt-scratch:rw,uid=10001,gid=10001,size=67108864 --mount "type=bind,src=$PWD/tools/artifact_probe.py,dst=/qualify.py,readonly" hmt-edge:qualification python /qualify.py > evidence/cd/stage4/container.json
      - name: Inventory and vulnerability scan of that same archive
        run: |
          TRIVY_IMAGE=$(python3 -c 'import json; print(json.load(open("evidence/cd/stage4/base-lock.json"))["trivy"])')
          skopeo copy --preserve-digests --override-arch arm64 --override-os linux oci-archive:evidence/cd/stage4/image.oci.tar "oci:$RUNNER_TEMP/hmt-scan:qualified"
          skopeo inspect "oci:$RUNNER_TEMP/hmt-scan:qualified" > evidence/cd/stage4/scan-input.json
          docker run --rm --mount "type=bind,src=$RUNNER_TEMP/hmt-scan,dst=/scan,readonly" --mount "type=bind,src=$PWD/evidence/cd/stage4,dst=/evidence" "$TRIVY_IMAGE" image --input /scan --format spdx-json --output /evidence/sbom.spdx.json --timeout 10m
          docker run --rm --mount "type=bind,src=$RUNNER_TEMP/hmt-scan,dst=/scan,readonly" --mount "type=bind,src=$PWD/evidence/cd/stage4,dst=/evidence" "$TRIVY_IMAGE" image --input /scan --scanners vuln,secret --list-all-pkgs --format json --output /evidence/vulnerabilities.json --timeout 10m
          python3 - <<'PYSCAN'
          import json, collections
          data = json.load(open('evidence/cd/stage4/vulnerabilities.json'))
          findings = [v for r in data.get('Results',[]) for v in (r.get('Vulnerabilities') or [])]
          print(json.dumps({'severity_counts':dict(collections.Counter(v.get('Severity') for v in findings)), 'reported_high_critical_unknown_findings':[{k:v.get(k) for k in ('VulnerabilityID','PkgName','InstalledVersion','FixedVersion','Severity')} for v in findings if v.get('Severity') not in ('LOW','MEDIUM')]}))
          PYSCAN
      - name: Qualify image, scanner and installed software before signing
        run: uv run --no-sync python tools/artifact_preflight.py "$GITHUB_SHA"
      - name: Stage the qualified OCI image for offline import and record signing continuation
        run: |
          uv run --no-sync python tools/appliance_prepare.py
          K3S_VERSION=$(python3 -c 'import json; print(json.load(open("deploy/appliance/inputs.json"))["k3s"]["version"].replace("+", "-"))')
          docker pull "rancher/k3s:$K3S_VERSION"
          docker run --rm --entrypoint kubectl "rancher/k3s:$K3S_VERSION" version --client
          docker run --rm --entrypoint ctr "rancher/k3s:$K3S_VERSION" --help
          echo 'Unsigned prequalification complete. Private signing and publication require the appliance-release Environment in release.yml.'
      - name: Verify offline k3s deployment and ledger persistence before merge
        run: |
          uv run --no-sync python tools/appliance_fetch.py
          bash deploy/appliance/smoke-test.sh "$PWD" 2>&1 | tee build/smoke.log
      - name: Surface artifact rejection
        if: failure()
        run: echo '::error::ARM64 artifact qualification rejected. Deployment and hardware remain HOLD. Inspect stage4 evidence.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arm64-artifact-${{ github.sha }}
          path: evidence/cd/stage4/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: k3s-smoke-${{ github.sha }}
          path: |
            build/*.log
            build/smoke*.json
            build/replay-*.json
          retention-days: 14
          if-no-files-found: warn
