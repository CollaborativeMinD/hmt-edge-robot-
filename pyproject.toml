[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hmt-edge-robot"
version = "1.0.0"
description = "Governed robotics subsystems, evidence, analytics, and resident HMT"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3", "numpy>=2.2,<3", "duckdb>=1.4,<2", "polars>=1.30,<2", "scikit-learn>=1.7,<2", "fastapi>=0.120,<1", "httpx>=0.28,<1", "uvicorn>=0.35,<1", "opencv-python-headless>=4.12,<6"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.14,<1", "jsonschema>=4.25,<5", "rdflib>=7,<8", "marimo>=0.23,<1"]

[project.scripts]
hmt-edge-robot = "hmt_edge_robot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.coverage.run]
source = ["hmt_edge_robot"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
